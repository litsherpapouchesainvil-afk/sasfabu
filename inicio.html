<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasfabu - Sistema Global de Recargas</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #3b82f6;
            --bg-gradient: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            --text-light: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(30, 58, 138, 0.7);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 1rem;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .menu-toggle span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: var(--text-light);
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8rem 2rem 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 2.5rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.85rem 2rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--text-light);
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #1e3a8a;
                flex-direction: column;
                gap: 0;
                width: 100%;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-in-out;
            }

            .nav-links.active {
                max-height: 300px;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                display: block;
                padding: 1.25rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Sasfabu</div>
        <button class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <!-- ENLACES CORREGIDOS CON TU URL DE RENDER -->
        <ul class="nav-links" id="nav-list">
            <li><a href="https://onrender.com">Inicio</a></li>
            <li><a href="https://onrender.com">Acceso Vendedores</a></li>
            <li><a href="https://onrender.com">Panel Administrador</a></li>
        </ul>
    </nav>

    <main class="hero">
        <h1>Conectando Fronteras con Recargas Instantáneas</h1>
        <p>La plataforma Cloud inteligente diseñada para la distribución y venta de saldo virtual internacional de forma
            ágil y segura.</p>

        <!-- BOTONES PRINCIPALES CON ENLACES EN LA NUBE -->
        <div class="cta-buttons">
            <a href="https://onrender.com" class="btn btn-primary">Iniciar Sesión de Ventas</a>
            <a href="https://onrender.com" class="btn btn-secondary">Consola de Control</a>
        </div>
    </main>
    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenuBtn.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>
</body>

</html>
<script>
    const mobileMenuBtn = document.getElementById('mobile-menu');
    const navList = document.getElementById('nav-list');

    mobileMenuBtn.addEventListener('click', () => {
        navList.classList.toggle('active');
    });
</script>
</body>

</html>
