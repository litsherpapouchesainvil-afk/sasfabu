<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Recargas</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1e293b;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-size: 1.75rem;
        }

        p {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1>Sasfabu</h1>
        <p>Ingresa tus credenciales para vender</p>

        <div id="error" class="error-msg"></div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" value="tienda1@sasfabu.com">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" value="******">
        </div>

        <button onclick="iniciarSesion()">Entrar al Panel de Ventas</button>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            errorDiv.style.display = 'none';

            if (!email || !password) {
                errorDiv.innerText = "Por favor, completa todos los campos.";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('vendedor_token', data.token);
                    localStorage.setItem('vendedor_email', email);
                    window.location.href = "index.html";
                } else {
                    // MODO PRUEBAS: Si las credenciales fallan, igual damos acceso simulado
                    ingresoSimuladoDirecto(email);
                }
            } catch (err) {
                // MODO PRUEBAS: Si el servidor está apagado, forzamos la entrada local
                ingresoSimuladoDirecto(email);
            }
        }

        function ingresoSimuladoDirecto(email) {
            localStorage.setItem('vendedor_token', 'TOKEN_LOCAL_DE_PRUEBA');
            localStorage.setItem('vendedor_email', email);
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
